name: Continuous Integration

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  stress-test:
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ (matrix.os == 'ubuntu-24.04-arm' && 'ghcr.io/llvm/arm64v8/libc-ubuntu-24.04') || 'ghcr.io/llvm/libc-ubuntu-24.04'}}
      options: --privileged
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false

    steps:
    - name: Checkout integration-aggressor
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Extra Dependencies
      run: |
        apt-get update
        # Install lldb matching the clang version in the container (likely 23 or 22)
        apt-get install -y lldb-23 || apt-get install -y lldb-22 || apt-get install -y lldb || true

    - name: Checkout LLVM Project
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        path: llvm-project
        fetch-depth: 1

    - name: Configure LLVM Libc
      run: |
        # Detect available clang version
        CLANG_VER=$(which clang-23 || which clang-22 || which clang)
        CLANGXX_VER=$(which clang++-23 || which clang++-22 || which clang++)
        echo "Using C compiler: $CLANG_VER"
        echo "Using C++ compiler: $CLANGXX_VER"

        CC=$CLANG_VER CXX=$CLANGXX_VER cmake -S llvm-project/llvm -B llvm-build -G Ninja \
          -DLLVM_ENABLE_PROJECTS="libc" \
          -DLLVM_LIBC_FULL_BUILD=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLLVM_ENABLE_ASSERTIONS=ON

    - name: Build LLVM Libc Integration Tests
      run: |
        ninja -C llvm-build libc-integration-tests

    - name: Build Integration Aggressor
      run: |
        cargo build --release

    - name: Run Stress Test (1 Hour)
      run: |
        # Detect available lldb version
        LLDB_PATH=$(which lldb-23 || which lldb-22 || which lldb)
        echo "Using LLDB: $LLDB_PATH"

        ./target/release/integration-aggressor --no-tui --duration 3600 --test-dir llvm-build/libc/test/integration --lldb-path $LLDB_PATH

    - name: Upload Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-reports-${{ matrix.os }}
        path: reports/
