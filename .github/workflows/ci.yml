name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

env:
  TEST_DURATION: ${{ github.event_name == 'pull_request' && 300 || 7200 }}

jobs:
  stress-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false

    steps:
    - name: Checkout integration-aggressor
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3 wget
        # Install LLVM 22
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22 all
        # Create symlink for asm headers (Debian/Ubuntu multiarch workaround)
        sudo ln -sf /usr/include/$(uname -m)-linux-gnu/asm /usr/include/asm

    - name: Checkout LLVM Project
      uses: actions/checkout@v4
      with:
        repository: llvm/llvm-project
        path: llvm-project
        fetch-depth: 1

    - name: Configure LLVM Libc
      run: |
        cmake -S llvm-project/runtimes -B llvm-build -G Ninja \
          -DLLVM_ENABLE_RUNTIMES="libc" \
          -DLLVM_LIBC_FULL_BUILD=ON \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DLLVM_ENABLE_ASSERTIONS=ON \
          -DCMAKE_C_COMPILER=clang-22 \
          -DCMAKE_CXX_COMPILER=clang++-22 \
          -DCMAKE_ASM_COMPILER=clang-22

    - name: Build LLVM Libc Integration Tests
      run: |
        ninja -C llvm-build libc-integration-tests

    - name: Build Integration Aggressor
      run: |
        cargo build --release

    - name: Run Stress Test
      run: |
        ./target/release/integration-aggressor --no-tui --duration ${{ env.TEST_DURATION }} --test-dir llvm-build/libc/test/integration --lldb-path lldb-22

    - name: Upload Reports on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-reports-${{ matrix.os }}
        path: reports/

